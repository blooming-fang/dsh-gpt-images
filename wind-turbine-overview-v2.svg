<?xml version="1.0" encoding="UTF-8"?>
<svg id="art" width="480" height="480" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="halo" cx="50%" cy="47%" r="50%">
      <stop offset="0%" stop-color="#2f9bff" stop-opacity="0.13"/>
      <stop offset="60%" stop-color="#1d6bb0" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#0a2544" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sweepR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fd2ff" stop-opacity="0"/>
      <stop offset="60%" stop-color="#7fd2ff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#8fdcff" stop-opacity="0.26"/>
    </radialGradient>
    <linearGradient id="bladeLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9efff"/>
      <stop offset="45%" stop-color="#8ad3f6"/>
      <stop offset="100%" stop-color="#55aadd"/>
    </linearGradient>
    <linearGradient id="bladeShadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d3f5e" stop-opacity="0"/>
      <stop offset="55%" stop-color="#0d3f5e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0d3f5e" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="towerLight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8e2fa"/>
      <stop offset="100%" stop-color="#6abae4"/>
    </linearGradient>
    <linearGradient id="towerShadeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d3f5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d3f5e" stop-opacity="0.62"/>
    </linearGradient>
    <linearGradient id="nacelleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8efff"/>
      <stop offset="45%" stop-color="#84cef2"/>
      <stop offset="100%" stop-color="#2d7fae"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="38%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#eefbff"/>
      <stop offset="100%" stop-color="#8ecdec"/>
    </radialGradient>
    <radialGradient id="groundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5cc8ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur10" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="tickglow" x="-300%" y="-150%" width="700%" height="400%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="blade" d="M 0 6 C -3.2 2 -5 -8 -6.2 -22 C -7.6 -40 -7.8 -66 -6.5 -92 C -5.5 -108 -3 -118 1 -122 C 4.9 -117 6.6 -105 7.4 -90 C 8.6 -64 8.1 -38 6.1 -20 C 4.4 -7 3.1 2 0 6 Z"/>
    <path id="bladeShade" d="M 0 6 C 3.1 2 4.4 -7 6.1 -20 C 8.1 -38 8.6 -64 7.4 -90 C 6.6 -105 4.9 -117 1 -122 L 0 6 Z"/>
  </defs>

  <circle cx="160" cy="160" r="150" fill="url(#halo)"/>
  <path d="M160 160 L160 12 A148 148 0 0 1 282 100 Z" fill="url(#sweepR)" filter="url(#blur10)"/>

  <!-- rings -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="#37b0ff" stroke-opacity="1" stroke-width="1.85"/>
  <circle cx="160" cy="160" r="142.5" fill="none" stroke="#37b0ff" stroke-opacity="0.3" stroke-width="1.05"/>
  <circle cx="160" cy="160" r="124" fill="none" stroke="#4fbfff" stroke-opacity="0.55" stroke-width="1.35" stroke-dasharray="2 5"/>
  <circle cx="160" cy="160" r="108" fill="none" stroke="#4fbfff" stroke-opacity="0.24" stroke-width="1.05"/>
  <circle cx="160" cy="160" r="66" fill="none" stroke="#4fbfff" stroke-opacity="0.18" stroke-width="1.05"/>

  <!-- orbit nodes -->
  <g>
    <g transform="translate(70 96)"><circle r="6" fill="#6ed0ff" opacity="0.1"/><circle r="2.6" fill="#8fdcff" opacity="0.85"/></g>
    <g transform="translate(246 106)"><circle r="5" fill="#6ed0ff" opacity="0.09"/><circle r="2.2" fill="#79d2ff" opacity="0.8"/></g>
    <g transform="translate(64 216)"><circle r="5" fill="#6ed0ff" opacity="0.09"/><circle r="2.2" fill="#79d2ff" opacity="0.8"/></g>
    <g transform="translate(252 218)"><circle r="6" fill="#6ed0ff" opacity="0.1"/><circle r="2.6" fill="#8fdcff" opacity="0.8"/></g>
    <g transform="translate(112 258)"><circle r="5" fill="#6ed0ff" opacity="0.08"/><circle r="2.1" fill="#79d2ff" opacity="0.75"/></g>
    <g transform="translate(210 254)"><circle r="4.6" fill="#6ed0ff" opacity="0.07"/><circle r="2" fill="#79d2ff" opacity="0.72"/></g>
  </g>

  <!-- ============ TURBINE ============ -->
  <g id="turbine" transform="translate(3 7) translate(161 214) scale(1.05) translate(-161 -214)">
    <ellipse cx="161" cy="288" rx="52" ry="13.5" fill="url(#groundGlow)"/>
    <ellipse cx="161" cy="288" rx="36" ry="9.4" fill="none" stroke="#5fc4f5" stroke-opacity="0.32" stroke-width="0.9" stroke-dasharray="2 4.5"/>
    <ellipse cx="161" cy="288" rx="19" ry="5.2" fill="none" stroke="#5fc4f5" stroke-opacity="0.15" stroke-width="0.85"/>

    <g filter="url(#glow)">
      <!-- tower -->
      <path d="M 155.8 151 L 166.2 151 L 170.4 288 L 151.6 288 Z" fill="url(#towerLight)"/>
      <path d="M 161 151 L 166.2 151 L 170.4 288 L 161 288 Z" fill="url(#towerShadeGrad)"/>
      <path d="M 155.8 151 L 166.2 151 L 170.4 288 L 151.6 288 Z" fill="none" stroke="#c3f0ff" stroke-opacity="0.6" stroke-width="0.85"/>
      <path d="M 161 153 L 161 286" stroke="#dff6ff" stroke-opacity="0.3" stroke-width="0.8"/>


      <!-- nacelle (world space, 3/4) -->
      <g transform="translate(161 150) rotate(-7)">
        <path d="M -2 -8.6 C 12 -12.4 34 -12 45 -8.4 C 50.5 -6.2 50.5 5.4 45 7.6 C 34 11.2 12 11.6 -2 8.6 Z" fill="url(#nacelleGrad)" stroke="#c9f2ff" stroke-opacity="0.7" stroke-width="0.85"/>
        <path d="M -2 2.4 C 12 6.6 34 7 45 4.6 C 48.4 3.4 50.5 1.4 50.5 -0.6 L 50.5 5.4 C 50.5 5.9 50 6.6 45 7.6 C 34 11.2 12 11.6 -2 8.6 Z" fill="#1f6690" opacity="0.55"/>
        <ellipse cx="45" cy="-0.4" rx="3.2" ry="7.6" fill="#3d8fc0" opacity="0.75" stroke="#bfeaff" stroke-opacity="0.5" stroke-width="0.7"/>
        <path d="M 18 -10.6 C 21 -4.6 21 4.6 18 10.8" fill="none" stroke="#2b7099" stroke-opacity="0.3" stroke-width="0.9"/>
        <path d="M 31 -10 C 33.5 -4.4 33.5 4.4 31 10" fill="none" stroke="#2b7099" stroke-opacity="0.2" stroke-width="0.8"/>
      </g>
      <!-- rotor -->
      <g transform="translate(161 150) rotate(-13) scale(0.84 1)">
        <!-- nacelle drawn in world space -->

        <!-- blades -->
        <g transform="rotate(0)">
          <use href="#blade" fill="url(#bladeLight)"/>
          <use href="#bladeShade" fill="url(#bladeShadeGrad)"/>
          <use href="#blade" fill="none" stroke="#cdf1ff" stroke-opacity="0.8" stroke-width="0.9"/>
        </g>
        <g transform="rotate(120)">
          <use href="#blade" fill="url(#bladeLight)"/>
          <use href="#bladeShade" fill="url(#bladeShadeGrad)"/>
          <use href="#blade" fill="none" stroke="#cdf1ff" stroke-opacity="0.8" stroke-width="0.9"/>
        </g>
        <g transform="rotate(240)">
          <use href="#blade" fill="url(#bladeLight)"/>
          <use href="#bladeShade" fill="url(#bladeShadeGrad)"/>
          <use href="#blade" fill="none" stroke="#cdf1ff" stroke-opacity="0.8" stroke-width="0.9"/>
        </g>

        <circle r="56" fill="none" stroke="#7fd2ff" stroke-opacity="0.08" stroke-width="0.8" stroke-dasharray="1.5 7"/>
        <circle r="13.4" fill="none" stroke="#8fd6f8" stroke-opacity="0.3" stroke-width="0.8"/>
        <circle r="11.4" fill="url(#hubGrad)" stroke="#e9fbff" stroke-opacity="0.9" stroke-width="1"/>
        <circle r="6" fill="none" stroke="#1a628c" stroke-opacity="0.4" stroke-width="1"/>
        <circle r="2.1" fill="#1a628c" opacity="0.55"/>
      </g>
    </g>
  </g>

  </svg>
